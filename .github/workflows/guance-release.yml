name: Guance Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 2.30.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: guance-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Verify release branch
        run: |
          if [[ $GITHUB_REF_NAME != guance-v2 ]]; then
            echo this workflow should only be run against guance-v2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate release version
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo version must match x.y.z
            exit 1
          fi

      - name: Verify tag does not exist
        run: |
          git fetch origin --tags
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo tag v$VERSION already exists
            exit 1
          fi

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Update version
        run: .github/scripts/update-version.sh "$VERSION"

      - name: Build stable javaagent
        run: ./gradlew --no-daemon --no-configuration-cache -Potel.stable=true :javaagent:shadowJar

      - id: commit-version
        name: Commit version update
        run: |
          if git diff --quiet; then
            echo created=false >> "$GITHUB_OUTPUT"
            echo sha=$(git rev-parse HEAD) >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version.gradle.kts \
            examples/distro/buildSrc/src/main/kotlin/Versions.kt \
            examples/distro/settings.gradle.kts \
            examples/extension/build.gradle.kts \
            docs/apidiffs/current_vs_latest/*.txt

          git commit -m "Update version to $VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"

          echo created=true >> "$GITHUB_OUTPUT"
          echo sha=$(git rev-parse HEAD) >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag -a "v$VERSION" -m "Version $VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            "javaagent/build/libs/opentelemetry-javaagent-$VERSION.jar" \
            --title "Version $VERSION" \
            --generate-notes \
            --verify-tag
